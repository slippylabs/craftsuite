# The four ArtCraft apps removed from the Craft Suite on 2026-10-11 because
# they use AI (see apps.txt). Their subdomains stay answered so old links land
# on the hub that listed them instead of a certificate-valid blank page.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lightcraft.slippylabs.com filmcraft.slippylabs.com effectcraft.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://art.slippylabs.com/;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdfcraft.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 https://projects.slippylabs.com/;
    }
}
