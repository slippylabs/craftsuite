# lightcraft.slippylabs.com -- LightCraft, an upstream ArtCraft web build served as
# shipped. Generated from deploy/vhost.tmpl by `sync.sh --vhosts`; edit the
# template, not this file.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lightcraft.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lightcraft.slippylabs.com;
    index index.html;

    # Trunk builds put a content hash in the app's and glue's filenames (its
    # length varies -- vectorcraft 0.9.0's is 15 digits), and a new release
    # ships new names, so these can be pinned for a year. sync.sh writes a .gz
    # beside each, which gzip_static (on globally) serves without compressing
    # ~25-56 MB per request.
    # Quoted: nginx reads an unquoted { as the start of the block.
    location ~* "-[0-9a-f]{8,}(_bg\.wasm|\.js)$" {
        include snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else revalidates. The page names the hashed files, so a stale
    # one would ask for a build sync.sh has already replaced; and some apps
    # (lightcraft) keep the same filenames from release to release, so their
    # module and glue must never be pinned. A revalidation is a 304.
    location / {
        include snippets/security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
